<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Contact Us</title>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/contact.css">
  </head>
  <body>
    <header>
      <nav>
        <a href="../index.html" aria-label="Home page">WLHC?</a>
        <ul class="nav-links">
          <li><a href="../pages/recipe.html" aria-label="Swedish Pancakes">Swedish Pancakes</a></li>
          <li><a href="../pages/about.html" aria-label="About us">About us</a></li>
          <li><p class="current-page">Contact</p></li>
        </ul>
        <ul class="nav-account">
          <li><a href="../login.html" aria-label="Log in/Sign up">Log in</a></li>
        </ul>
      </nav>
    </header>
    <main class="main-content container">
      <h1>Want to Contact Us?</h1>
      <p>Fill this form and we will get back to you (if it actually worked)</p>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required autocomplete="name" placeholder="Abe Abesson" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="abe.abesson@example.com" />
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" required>
            <option value="" disabled selected>Select a subject</option>
            <option value="general">General Inquiry</option>
            <option value="feedback">Hate mail</option>
            <option value="report">Phishing Attempt</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" cols="50" required placeholder="Your recipes ruined my life, why would you d(...)"></textarea>
        </div>
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
